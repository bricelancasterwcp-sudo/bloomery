[workspace]
resolver = "2"
members = [
    "crates/bloomery-core",
    "crates/bloomery-substrate",
    "crates/bloomery-daemon",
    "crates/bloomery-bench",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"
regex = "1"
libc = "0.2"
