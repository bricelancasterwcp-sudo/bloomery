# codec-tasks-v1 -- frozen G4 codec-landing measurement fixture set.
#
# Pre-registered instrument: docs/superpowers/evidence/2026-08-15-g4-protocol.md
# section 2. This set is embedded in the daemon binary (see
# src/codec_probe/fixtures.rs::shipped_fixture_set) and its contents are
# frozen -- any change is a recorded amendment (protocol section 8), never a
# silent edit.
#
# TOML gotcha: a triple-quoted basic string (`"""..."""`) strips only the
# newline immediately after the OPENING delimiter, not any other
# whitespace/newlines in the body. That is exactly what every multi-line
# `contents`/`goal` value below relies on (content starts on the line right
# after the opening `"""`). But `[fixture.reference]`'s `search`/`replace`
# values must match a target file's bytes exactly, byte for byte -- for
# those, prefer single-line basic strings ("...") so there is no
# triple-quote newline-stripping behavior to reason about at all. A
# `search`/`replace` value that itself needs an embedded double quote uses a
# single-quoted TOML literal string ('...') instead of escaping.

set = "codec-tasks-v1"

[[fixture]]
name = "py-mean-off-by-one"
lens = "python"
target = "stats.py"
goal = """stats.py's mean() divides by len(values) + 1, so mean([2, 4]) returns 2.0 instead of 3.0. Fix mean() in stats.py so it divides by len(values). Patch the file, then emit done."""

[[fixture.file]]
path = "stats.py"
contents = """
def mean(values):
    total = 0
    for v in values:
        total += v
    return total / (len(values) + 1)
"""

[fixture.reference]
search = "    return total / (len(values) + 1)"
replace = "    return total / len(values)"

