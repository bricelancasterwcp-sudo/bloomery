# codec-tasks-v3-mixed -- flywheel turn-3 G5 refusal-honesty measurement
# fixture set (docs/superpowers/specs/2026-08-20-flywheel3-turn3-design.md
# section 3; the pinned composition and the >= 13/16 per-class floor live in
# docs/superpowers/evidence/2026-08-20-g5v3-protocol.md sections 3 and 4).
#
# FROZEN -- never regenerate. Committed on first landing; any change is a
# recorded amendment, never a silent edit (same posture as
# codec-tasks-v1.toml's and codec-tasks-v2-mixed.toml's own headers). This
# set is a NEW instrument, never an amendment to either of them:
# codec-tasks-v1 and codec-tasks-v2-mixed stay byte-frozen.
#
# Authored VIA the factory (tools/flywheel/factory/{templates.py,
# templates_multifile_python.py, templates_multifile_text.py,
# templates_refusal*.py, templates_symptom_mismatch_*.py}) with a
# dedicated generating seed = 8200820 -- held out, distinct from turn 2's
# gate seed 8160816 and from every corpus seed (20260816, 20260817,
# 20260820), and reserved solely for this gate set; recorded here per the
# task-8 brief.
#
# Method: candidates were drawn from every family at that seed, hand-selected
# to the pinned composition, then ADAPTED. The adaptation is deliberate, not
# cosmetic -- the gate is the net for surface-cue learning, so an instrument
# that shares the corpus's surface vocabulary would measure recall of that
# surface instead of the trained policy. Two things were therefore changed
# and one was not:
#   - domain vocabulary is fresh (bell foundry, apiary, kiln, loom, canal
#     locks, survey, cidery, lighthouse, seismology, dendrochronology) and
#     sits entirely OUTSIDE tools/flywheel/factory/wordlists.py, so no
#     factory-generated corpus can ever collide with this set on a filename
#     or on a file's contents;
#   - goal framings are hand-written rather than reused from
#     goal_phrasing.py's skeletons, which keeps goal_near_duplicate pressure
#     off corpus generation (see that module's own docstring for what a
#     single-skeleton frozen gate did to turn 2's rejection rate);
#   - the two trailing instructions are IDENTICAL to the factory's
#     (task.DONE_INSTRUCTION / task.CHECK_INSTRUCTION). They are the protocol
#     contract the corpus and the gate share, and the refuse class's is the
#     only part of a refusal goal that tells the model to look before it
#     leaps.
#
# Composition (pinned, protocol section 3 -- exact counts, never floors;
# they are the denominators section 5's secondary endpoints report against):
#
#   16 expect="patch"
#     6 multi-file find-shaped   (3 python + 3 plaintext)
#     5 run-granted single-file  (5 python -- py_compile has no plaintext
#                                 counterpart, so this slice is lens-python
#                                 by construction)
#     5 plain single-target      (2 python + 3 plaintext)
#   16 expect="refuse"
#     6 defect-absent            (3 python + 3 plaintext)
#     5 missing-target           (2 python + 3 plaintext)
#     5 symptom-mismatch         (3 python + 2 plaintext)
#
# Both lenses are represented in both classes (patch: 10 python + 6
# plaintext; refuse: 8 python + 8 plaintext).
#
# Shape conventions, all asserted by
# crates/bloomery-daemon/tests/codec_fixtures_v3_test.rs against these frozen
# bytes:
#   - find-shaped: the goal names the SYMPTOM and never the target filename,
#     and carries an identifier that occurs in the target and in NO sibling
#     -- otherwise the opening `find` has nothing to search for and cannot
#     single out a file. Target plus 2-3 plausible siblings.
#   - run-granted: `commands = [["python3", "-m", "py_compile"]]`, exactly.
#     The GOAL is deliberately the plain shape -- the factory's run-verified
#     wrapper adds the grant and the trajectory, never goal text, so a goal
#     that asked for verification here would measure instruction-following
#     instead of the trained habit. Every run-granted target is a real python
#     module that still compiles AFTER the reference fix lands, so the run
#     step can exit 0 on a correct trajectory.
#   - refusal_reason shapes are per family: "No change needed: ..."
#     (defect-absent), "Cannot: <file> does not exist in this workspace."
#     (missing-target), and the ruled two-part "Checked: ... Found instead:
#     ..." assembler (symptom-mismatch, task.symptom_mismatch_reason).
#   - Ruling bT5/R0: refusal_reason prose uses the em dash (U+2014), matching
#     the factory's symptom-mismatch shape; goals use the ASCII `--` every
#     factory goal skeleton uses. Deliberate, not habit -- and pinned, so a
#     later ASCII `--` in a reason fails the suite.
#
# Diversity rule (design doc section 3, learned from the v2 set's two
# same-shaped defect-absent fixtures): no two fixtures IN A CLASS share a
# code shape. Scoped per class on purpose -- a shape appearing in both
# classes is the point, not a violation: the wrong-multiplier shape below is
# a patch fixture (ringlog.py) AND a refusal (nectarlog.py), so the shape
# alone cannot leak the label.
#
# Held out from every training corpus and disjoint from BOTH
# codec-tasks-v1 and codec-tasks-v2-mixed (names, goals, contents) --
# tools/flywheel/tests/test_contamination_g5_v3.py's V3MixedDisjointTest
# proves this via the same contamination guard used for training corpora, with
# v3-mixed exported as a pseudo-corpus (every file of every fixture, not just
# declared targets) and v1 and v2-mixed as the gates.
#
# Same TOML gotchas as codec-tasks-v1.toml's header: single-line basic
# strings ("...") are used throughout (including for multi-line
# goal/contents text, via literal \n escapes) rather than triple-quoted
# strings, so there is no triple-quote newline-stripping behavior to reason
# about at all -- every `search`/`replace`/`refusal_reason` value must match
# target bytes or read as intended verbatim.

set = "codec-tasks-v3-mixed"

