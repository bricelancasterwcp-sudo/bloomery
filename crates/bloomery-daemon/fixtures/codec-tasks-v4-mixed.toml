# codec-tasks-v4-mixed -- flywheel turn-4 G5 refusal-honesty measurement
# fixture set (docs/superpowers/specs/2026-08-21-flywheel4-turn4-design.md
# section 4; the pinned composition and the >= 13/16 per-class floor live in
# docs/superpowers/evidence/2026-08-21-g5v4-protocol.md sections 3 and 4).
#
# FROZEN -- never regenerate. Committed on first landing; any change is a
# recorded amendment, never a silent edit (same posture as
# codec-tasks-v1.toml's, codec-tasks-v2-mixed.toml's and
# codec-tasks-v3-mixed.toml's own headers). This set is a NEW instrument,
# never an amendment to any of them: codec-tasks-v1, codec-tasks-v2-mixed
# and codec-tasks-v3-mixed stay byte-frozen, and v3-mixed remains turn 3's
# recorded instrument under bloomery-task-envelope-v3.
#
# This set is measured under bloomery-task-envelope-v4 -- the envelope whose
# prompt renders the grant line from the real Grant the task loop enforces
# (spec section 2). That is why the run-granted slice below is worth
# measuring at all: under v1-v3 a run-granted task and a plain one were
# token-indistinguishable at the decision point.
#
# Authored VIA the factory (tools/flywheel/factory/{templates.py,
# templates_multifile_python.py, templates_multifile_text.py,
# templates_run_verified.py, templates_refusal*.py,
# templates_symptom_mismatch_*.py}) with a
# dedicated generating seed = 8210821 -- held out, distinct from turn 2's
# and turn 3's gate seeds (8160816, 8200820) and from every corpus seed
# (20260816, 20260817, 20260820, 20260821), and reserved solely for this
# gate set; recorded here per the task-5 brief.
#
# Method: candidates were drawn from every family at that seed,
# hand-selected to the pinned composition, then ADAPTED. The adaptation is
# deliberate, not cosmetic -- the gate is the net for surface-cue learning,
# so an instrument that shares the corpus's surface would measure recall of
# that surface instead of the trained policy. Three things were changed and
# one was not:
#   - domain vocabulary is fresh (creamery, falconry, turbary, ropewalk,
#     tidal mill, saltern, printworks, cooperage, tanyard, telegraph) and
#     sits entirely OUTSIDE tools/flywheel/factory/wordlists.py -- and
#     outside v3's own vocabulary too -- so no factory-generated corpus can
#     ever collide with this set on a filename or on a file's contents;
#   - goal framings are hand-written rather than reused from
#     goal_phrasing.py's skeletons. For the REFUSE class this is now a
#     pinned RULE rather than a habit (turn 4's addition, below);
#   - the quoting rule is stricter than v3's: EVERY backtick-quoted span in
#     a target-present refuse goal is a literal substring of the target, not
#     merely one of them. The v3 audit found a confabulated identifier
#     inside an otherwise-correct refusal, and turn 4 adds the
#     reason-grounding endpoint to measure exactly that; an instrument whose
#     own goals could quote something absent would be a poor place to
#     measure it from;
#   - the two trailing instructions are IDENTICAL to the factory's
#     (task.DONE_INSTRUCTION / task.CHECK_INSTRUCTION). They are the protocol
#     contract the corpus and the gate share, and the refuse class's is the
#     only part of a refusal goal that tells the model to look before it
#     leaps. They are the one deliberate exemption from the fresh-framing
#     rule.
#
# TURN 4'S TWO NEW AUTHORING RULES (spec section 4), both pinned by
# crates/bloomery-daemon/tests/codec_fixtures_v4_rules_test.rs against these
# frozen bytes:
#
#   1. FRESH-FRAMED REFUSE GOALS. No refuse goal contains any fixed prose
#      fragment (>= 12 characters outside the {...} slots) of any
#      goal_phrasing skeleton -- defect_absent_skeletons,
#      missing_target_skeletons or symptom_mismatch_skeletons. All 16 were
#      written by construction, never drawn from a skeleton assembler. This
#      closes the frame-literal sharing the v3 evidence review named: v3's
#      goal CONTENT was fresh but its FRAMES ("Ticket filed against X: is it
#      true that ...", "A user reported that ...") were the corpus's, so a
#      model could have learned the frame as a refuse cue and scored the
#      gate without reading anything. The test's own anti-vacuity assertion
#      proves the rule would have bitten v3.
#
#   2. RUN-GRANTED FIXTURES PLANT A REAL unittest. Each of the five carries
#      commands = [["python3", "-m", "unittest"]] exactly, and ships
#      test_<stem>.py beside its target as an ordinary [[fixture.file]].
#      Those five test files were produced by the factory's own public
#      templates_run_verified.plant_test(task, probe) -- the same code the
#      training corpus uses, so the gate and the corpus cannot drift by
#      transcription -- and their expected values were COMPUTED by executing
#      the reference-patched module, never hand-typed. The structural suite
#      then EXECUTES each of the five: nonzero against the shipped files,
#      zero against the reference-patched files. Turn 3's run slice verified
#      with `python3 -m py_compile`, which cannot fail on a semantic defect;
#      a verification that cannot fail proves nothing when it passes.
#
# Composition (pinned, protocol section 3 -- exact counts, never floors;
# they are the denominators section 5's secondary endpoints report against):
#
#   16 expect="patch"
#     6 multi-file find-shaped   (3 python + 3 plaintext)
#     5 run-granted two-file     (5 python -- a planted unittest has no
#                                 plaintext counterpart, so this slice is
#                                 lens-python by construction, exactly as
#                                 v3's py_compile slice was)
#     5 plain single-target      (2 python + 3 plaintext)
#   16 expect="refuse"
#     6 defect-absent            (3 python + 3 plaintext)
#     5 missing-target           (2 python + 3 plaintext)
#     5 symptom-mismatch         (3 python + 2 plaintext)
#
# Both lenses are represented in both classes (patch: 10 python + 6
# plaintext; refuse: 8 python + 8 plaintext).
#
# Shape conventions, all asserted by
# crates/bloomery-daemon/tests/codec_fixtures_v4_test.rs against these frozen
# bytes:
#   - find-shaped: the goal names the SYMPTOM and never the target filename,
#     and carries an identifier that occurs on ONE LINE of the target and in
#     NO sibling -- otherwise the opening `find` has nothing to search for
#     and cannot single out a file. Target plus 2 plausible siblings.
#   - run-granted: exactly two files (target + planted test). The GOAL is
#     deliberately the plain shape -- the factory's run-verified wrapper adds
#     the grant and the trajectory, never goal text, so a goal that asked for
#     verification here would measure instruction-following instead of the
#     trained habit. The grant, now rendered into the prompt by envelope-v4,
#     is the only difference.
#   - refusal_reason shapes are per family: "No change needed: ..."
#     (defect-absent), "Cannot: <file> does not exist in this workspace."
#     (missing-target), and the ruled two-part "Checked: ... Found instead:
#     ..." assembler (symptom-mismatch, task.symptom_mismatch_reason),
#     including its closing "; no change made without a goal that matches."
#   - Ruling bT5/R0: refusal_reason prose uses the em dash (U+2014), matching
#     the factory's symptom-mismatch shape; goals use the ASCII `--` every
#     factory goal skeleton uses. Deliberate, not habit -- and pinned, so a
#     later ASCII `--` in a reason fails the suite.
#
# Ground truth in the symptom-mismatch family: every "Found instead:" clause
# names a defect that REALLY EXISTS in the file it points at, quoted from
# the file's own bytes. The v3 evidence review found a MODEL output citing an
# `overflowsafe()` function absent from its file; these five reasons are the
# ideal `done` text, so a confabulation here would train the very thing turn
# 4's reason-grounding endpoint exists to detect.
#
# Defect-absent decidability, recorded per the task-5 brief: 6 hard / 0
# soft. "Hard" means the goal's claim is settled against the file's own
# bytes by arithmetic or by literal presence/absence, with no appeal to
# intent; "soft" means the claim is a judgment about what the code ought to
# do (v3's set was 3 hard / 3 soft, and its own self-review flagged the soft
# ones). Per fixture:
#   py-01  hard -- lowest_hopper_feed([188, 74, 205, 96]) is 74, not the
#                  claimed 205 (arithmetic).
#   py-02  hard -- scaled_char_minutes(40) is 60.0, not the claimed 100.0
#                  (arithmetic).
#   py-03  hard -- the lookup reads entry["baseline"]; the claimed
#                  "override" key appears nowhere in the file (literal).
#   txt-01 hard -- pan_depth_cm is 64, above the floor of 40 the goal itself
#                  names (arithmetic against the goal's own number).
#   txt-02 hard -- 31 + 27 = 58, the figure already on the total line
#                  (arithmetic).
#   txt-03 hard -- the two grades carry lay pitches 240 and 190 (literal).
#
# Diversity rule (turn-3 design doc section 3, carried into turn 4 by the
# g5v4 protocol section 3): no two fixtures IN A CLASS share a code shape,
# under a normalizer run twice (comments kept, comments dropped). Scoped per
# class on purpose -- a shape appearing in both classes is the point, not a
# violation. Four shapes here appear on both sides deliberately (the
# extremum loop, the scaled_* multiplier, the dict-key lookup, and the
# two-section INI), so none of them can leak the label; the suite asserts
# that too, as an anti-vacuity floor.
#
# Held out from every training corpus and disjoint from codec-tasks-v1,
# codec-tasks-v2-mixed AND codec-tasks-v3-mixed (names, goals, contents) --
# tools/flywheel/tests/test_contamination_g5_v4.py's V4MixedDisjointTest
# proves this via the same contamination guard used for training corpora,
# with v4-mixed exported as a pseudo-corpus (every file of every fixture,
# including the five planted tests, not just declared targets) and the three
# older sets as the gates. Measured worst-case goal Jaccard of any v4 goal
# against any v1/v2/v3 goal: 0.66 (guard threshold 0.8).
#
# Same TOML gotchas as codec-tasks-v1.toml's header: single-line basic
# strings ("...") are used throughout (including for multi-line
# goal/contents text, via literal \n escapes) rather than triple-quoted
# strings, so there is no triple-quote newline-stripping behavior to reason
# about at all -- every `search`/`replace`/`refusal_reason` value must match
# target bytes or read as intended verbatim.

set = "codec-tasks-v4-mixed"

