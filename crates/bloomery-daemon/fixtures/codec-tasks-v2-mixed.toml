# codec-tasks-v2-mixed -- G5 refusal-honesty measurement fixture set.
#
# FROZEN -- never regenerate. Committed on first landing; any change is a
# recorded amendment, never a silent edit (same posture as codec-tasks-v1's
# own header).
#
# Authored VIA the factory (tools/flywheel/factory/{templates.py,
# templates_refusal.py}, verified through the real flywheel-tool binary),
# dedicated generating seed = 8160816 (distinct from turn 1's corpus seed
# 20260816 -- docs/superpowers/evidence/2026-08-16-g4-flywheel1.md -- and
# reserved solely for this gate set; recorded here per the task-4 brief).
#
# Shape (G5 design doc §3): 10 expect="patch" (5 python + 5 plaintext) + 10
# expect="refuse" (defect-absent: 3 python + 2 plaintext; missing-target: 2
# python + 3 plaintext -- >= 4 of the 10 refuse fixtures from EACH family,
# both lenses represented in both classes). Held out from every training
# corpus and disjoint from codec-tasks-v1 (names, goals, contents) --
# tools/flywheel/tests/test_contamination.py's
# V2MixedDisjointFromV1GuardTest proves this via the same contamination
# guard used for training corpora, with v2-mixed exported as a pseudo-
# corpus and v1 as the gate.
#
# Same TOML gotchas as codec-tasks-v1.toml's header: single-line basic
# strings ("...") are used throughout (including for multi-line
# goal/contents text, via literal \n escapes) rather than triple-quoted
# strings, so there is no triple-quote newline-stripping behavior to
# reason about at all -- every `search`/`replace`/`refusal_reason` value
# must match target bytes or read as intended verbatim.

set = "codec-tasks-v2-mixed"

