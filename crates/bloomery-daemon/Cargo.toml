[package]
name = "bloomery-daemon"
version = "0.1.0"
edition = "2021"
# Dual-licensed: AGPL-3.0-only, or a commercial license (see LICENSING.md).
license = "AGPL-3.0-only"
publish = false

[[bin]]
# Explicit target so the produced binary is named `flywheel-tool` (hyphen),
# matching the flywheel task-1 brief's wire contract and
# `tests/flywheel_tool_test.rs`'s `env!("CARGO_BIN_EXE_flywheel-tool")` —
# cargo's autobins default would otherwise name it `flywheel_tool` (the
# `src/bin/` filename verbatim, underscore). No GPU toolchain required to
# build this target — see `src/bin/flywheel_tool.rs`'s module docs.
name = "flywheel-tool"
path = "src/bin/flywheel_tool.rs"

[features]
# The real llama.cpp backend, forwarded straight through to bloomery-substrate
# so the whole workspace stays GPU-free by default (see that crate's Cargo.toml).
llama = ["bloomery-substrate/llama"]
# Vulkan offload, forwarded the same way.
vulkan = ["llama", "bloomery-substrate/vulkan"]
# Compiles `src/test_support.rs` for consumers outside this crate (its own
# `#[cfg(test)]` unit tests get it for free). Off by default so a plain
# `cargo build` / `cargo build --workspace` never links test-only wiring
# into a release binary; `tests/*.rs` and (later) `bloomery-bench` opt in
# via the self dev-dependency below.
test-support = []

[dependencies]
bloomery-core = { path = "../bloomery-core" }
bloomery-substrate = { path = "../bloomery-substrate" }
tiny_http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
# Recompiled by the task executors (bloomery_core::action validates a
# `find` pattern at parse time, but exec.rs is standalone per the P3 Task 1
# brief, so it compiles the regex again rather than trusting a caller).
regex = { workspace = true }
# libc::O_NOFOLLOW for the task executors' grant-bounded file opens (see
# task/exec.rs). Already transitive via llama-cpp-sys-2; declared direct
# because hardcoding the syscall flag's numeric value would be exactly the
# magic-number this project forbids.
libc = { workspace = true }

[dev-dependencies]
# Self-dependency trick: integration test binaries under `tests/` link this
# crate through `dev-dependencies` rather than the normal target, so this
# entry — not the `[features]` table above — is what turns `test-support`
# on for them, without ever turning it on for the library's own default
# build (resolver = "2" keeps the two instances' features unmerged).
bloomery-daemon = { path = ".", features = ["test-support"] }
